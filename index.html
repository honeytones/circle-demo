<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Circle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Circle, save together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
/* ============================================================
   Adire indigo system — deep cloth blues, calico white,
   marigold reserved for the pot alone.
   ============================================================ */
:root{
  --frame:#0F1B4D;          /* outside the phone card */
  --card:#ffffff;           /* card surfaces */
  --on-indigo:#FAF6EE;      /* text on indigo surfaces (fixed both themes) */
  --on-indigo-soft:#C9D2F2; /* secondary text on indigo (fixed both themes) */
  --stamp-paid:#1B2A6B;
  --indigo-950:#0F1B4D;
  --indigo-800:#1B2A6B;
  --indigo-600:#31418F;
  --indigo-100:#DDE2F4;
  --calico:#FAF6EE;
  --calico-dim:#EFE9DC;
  --ink:#141726;
  --ink-soft:#4A4F63;
  --pot-gold:#E8A93D;
  --pot-gold-deep:#B97F1E;
  --ok:#2E7D4F;
  --miss:#B3432B;
  --radius:14px;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --body:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
/* Dark: same cloth, dyed deeper. Layout, stamp card, and marigold pot
   moments identical — this is the variant that sits comfortably inside
   the Zano wallet's dark dApp browser. */
[data-theme="dark"]{
  --frame:#060B20;
  --calico:#0C1434;         /* app background, Zano navy */
  --calico-dim:#26336E;     /* hairlines & borders */
  --card:#152257;
  --ink:#EDEFF8;
  --ink-soft:#A6AECB;
  --indigo-100:#3D4A8F;     /* current-row highlight & pending stamps */
  --stamp-paid:#8FA1EC;
}
[data-theme="dark"] .stamp.paid{color:#0F1B4D}
[data-theme="dark"] .stamprow.current{background:#22306B}
[data-theme="dark"] .btn-quiet{color:#A9B8F5}
[data-theme="dark"] .btn[disabled]{opacity:.6}
[data-theme="dark"] #app{
  background:
    radial-gradient(140% 90% at 85% 0%, rgba(46,109,255,.16), transparent 55%),
    radial-gradient(120% 80% at 10% 100%, rgba(62,211,198,.10), transparent 50%),
    var(--calico);
}
[data-theme="dark"] .bigstamp{background:var(--stamp-paid);color:#0F1B4D}
[data-theme="dark"] .bigstamp.gold{background:radial-gradient(circle at 32% 30%, #F6C566, var(--pot-gold) 55%, var(--pot-gold-deep));color:#3A2705}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  background:var(--frame);
  color:var(--ink);
  min-height:100dvh;
  display:flex;
  justify-content:center;
}
/* Phone frame: fills small screens, centers politely on desktop */
#app{
  width:100%;
  max-width:420px;
  min-height:100dvh;
  background:var(--calico);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--pot-gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- header ---------- */
header{
  background:var(--calico);
  color:var(--ink);
  padding:calc(env(safe-area-inset-top, 0px) + 13px) 18px 0;
}
header .brandtop{min-height:52px;display:flex;align-items:center;justify-content:center}
header .brandwordmark{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;letter-spacing:-.01em;color:var(--ink);width:100%;text-align:center}
#theme-toggle{
  background:rgba(255,255,255,.12);color:var(--on-indigo);
  border-radius:50%;width:38px;height:38px;font-size:17px;
  display:grid;place-items:center;flex:none;margin-top:2px;
}
header .kicker{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-indigo-soft);font-weight:600;
}
header h1{
  font-family:var(--display);
  font-size:26px;font-weight:800;line-height:1.1;
  margin-top:2px;
}
/* resist-dot border: the adire mark, drawn in CSS */
.adire-rule{
  height:8px;
  background-image:radial-gradient(circle 2.5px, #FAF6EE 2.4px, transparent 2.6px);
  background-size:14px 8px;
  background-position:center;
  background-color:var(--indigo-800);
}

/* ---------- main ---------- */
main{flex:1;padding:20px 20px 120px;overflow-y:auto}
.screen{display:none}
.screen.active{display:block;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h2{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15}
.sub{color:var(--ink-soft);font-size:15px;line-height:1.45;margin-top:6px}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  border:1.5px solid var(--calico-dim);
  border-radius:var(--radius);
  padding:16px;
  margin-top:16px;
}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--calico-dim)}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink-soft);font-size:14px}
.row .v{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:800}
.fusdmark{height:.8em;width:.8em;vertical-align:-0.08em;margin-left:4px;border-radius:50%}
.money small{font-size:.55em;font-weight:600;color:var(--ink-soft);margin-left:3px;letter-spacing:.04em}

/* ---------- the stamp card (signature element) ---------- */
.stampcard{
  background:var(--card);
  border:1.5px solid var(--calico-dim);
  border-radius:var(--radius);
  padding:16px 14px;
  margin-top:16px;
}
.stampcard .title{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;
}
.stampcard .title .t{font-family:var(--display);font-weight:800;font-size:16px}
.stampcard .title .wk{font-size:13px;color:var(--ink-soft);font-weight:600;margin-left:auto}
.sharebtn{
  background:none;color:var(--indigo-600);
  font-size:13px;font-weight:700;padding:4px 2px;flex:none;
}
[data-theme="dark"] .sharebtn{color:#A9B8F5}
.stamprow{
  display:grid;
  grid-template-columns:64px 1fr;
  align-items:center;
  gap:10px;
  padding:7px 6px;
  border-radius:10px;
}
.stamprow.current{background:var(--indigo-100)}
.stamprow.past{opacity:.55}
.stamprow .who{font-size:13.5px;font-weight:700;line-height:1.2}
.stamprow .who .pos{display:block;font-size:11px;color:var(--ink-soft);font-weight:600}
.stamps{display:flex;gap:8px;flex-wrap:wrap}
.stamp{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--indigo-100);
  display:grid;place-items:center;
  font-size:15px;color:#fff;
  background:transparent;
  transition:transform .15s ease;
}
.stamp.paid{background:var(--stamp-paid);border-color:var(--stamp-paid)}
.stamp.missed{background:transparent;border-color:var(--miss);color:var(--miss)}
.stamp.pending{border-style:dashed}
.stamp.you{box-shadow:0 0 0 2.5px var(--pot-gold)}
.potcoin{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #F6C566, var(--pot-gold) 55%, var(--pot-gold-deep));
  display:grid;place-items:center;
  font-size:14px;
  box-shadow:0 1px 4px rgba(185,127,30,.45);
}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:50%;display:inline-block}
.legend .l-paid{background:var(--stamp-paid)}
.legend .l-miss{border:2px solid var(--miss)}
.legend .l-pot{background:var(--pot-gold)}
.poweredby{
  margin-top:26px;text-align:center;font-size:12.5px;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
}
.poweredby img{height:16px;width:16px;border-radius:50%}
.poweredby .zanochip{border-radius:5px}
.poweredby b{color:var(--ink);font-weight:700}
.faqlink{margin-top:12px;text-align:center}
.faqlink button{background:none;color:var(--ink-soft);font-size:13.5px;font-weight:700}
.faq details{background:var(--card);border:1.5px solid var(--calico-dim);border-radius:var(--radius);padding:13px 15px;margin-top:10px}
.faq summary{font-weight:700;font-size:15px;cursor:pointer}
.faq p{margin-top:9px;color:var(--ink-soft);font-size:14.5px;line-height:1.5}
.faq a{color:var(--indigo-600);font-weight:700}
[data-theme="dark"] .faq a{color:#A9B8F5}

/* ---------- status strip ---------- */
.status{
  margin-top:16px;
  background:var(--indigo-800);
  color:var(--on-indigo);
  border-radius:var(--radius);
  padding:16px;
}
.status .big{font-family:var(--display);font-size:19px;font-weight:800;line-height:1.25}
.status .small{margin-top:6px;font-size:13.5px;color:var(--on-indigo-soft)}
.status.gold{background:linear-gradient(135deg, var(--pot-gold), var(--pot-gold-deep));color:#3A2705}
.status.gold .small{color:#5C400E}

/* ---------- big numbers ---------- */
.hero-amount{
  font-family:var(--display);
  font-size:52px;font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1;
  margin-top:18px;
}
.hero-amount small{font-size:18px;color:var(--ink-soft);font-weight:600;margin-left:6px}

/* ---------- action bar (thumb zone) ---------- */
.actionbar{
  position:absolute;left:0;right:0;bottom:0;
  padding:14px 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background:linear-gradient(to top, var(--calico) 70%, transparent);
}
.btn{
  width:100%;
  min-height:56px;
  border-radius:16px;
  font-size:18px;font-weight:800;
  font-family:var(--display);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{background:var(--indigo-800);color:var(--on-indigo)}
.btn-primary:active{transform:scale(.985)}
.btn-gold{background:linear-gradient(135deg,var(--pot-gold),var(--pot-gold-deep));color:#2E1F04}
.btn-quiet{background:transparent;color:var(--indigo-800);font-size:15px;min-height:44px;font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}
/* Chat moment buttons: quiet, in a chat app green */
.btn-wa{background:transparent;color:#1B9E52;font-size:15px;min-height:44px;font-weight:700}
[data-theme="dark"] .btn-wa{color:#4CD98A}
#app-toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);background:var(--ink,#182235);color:#fff;font-family:var(--body);font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:99;max-width:86vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#app-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- paid / celebration states ---------- */
.bigstamp{
  width:110px;height:110px;border-radius:50%;
  background:var(--indigo-800);
  color:var(--on-indigo);
  display:grid;place-items:center;
  font-size:54px;
  margin:26px auto 0;
  animation:stampin .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes stampin{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.bigstamp.gold{background:radial-gradient(circle at 32% 30%, #F6C566, var(--pot-gold) 55%, var(--pot-gold-deep));color:#3A2705}
.center{text-align:center}

/* ---------- demo controls ---------- */
.demo-ribbon{
  position:absolute;top:64px;right:-34px;z-index:5;
  transform:rotate(38deg);
  background:var(--pot-gold);color:#3A2705;
  font-size:11px;font-weight:800;letter-spacing:.1em;
  padding:4px 40px;pointer-events:none;
}
.demo-panel{
  margin-top:22px;
  border-top:2px dashed var(--calico-dim);
  padding-top:14px;
}
.demo-panel .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
.demo-panel .btns{display:flex;gap:8px;flex-wrap:wrap}
.demo-panel button{
  background:var(--card);border:1.5px solid var(--calico-dim);
  border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);
}

/* ============================================================
   v2 — mockup port (circle-screens FINAL b43b3bfd). Additive and
   scoped: rules fire only inside .v2 wrappers or on the shared
   brand marks, so unported screens are untouched.
   ============================================================ */
:root{
  --field:#F4F1E9; --line-2:#ECE7DB;
  --shadow-card:0 1px 2px rgba(15,27,77,.04), 0 8px 24px -12px rgba(15,27,77,.18);
}
[data-theme="dark"]{
  --field:#101B44; --line-2:#26336E;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}

#app:has(.v2home) .fmark, #app:has(.v2join) .fmark, #app:has(.v2faq) .fmark{display:block}
#app:has(.screen.v2) .adire-rule{display:none}
#app:has(.screen.v2) main{padding:0 18px 190px}
/* pot card */
.v2 .pot{background:linear-gradient(150deg,var(--indigo-800),var(--indigo-950));color:#fff;border-radius:20px;padding:11px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-card);margin-top:6px}
.v2 .pot::after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;background:radial-gradient(circle,rgba(232,169,61,.5),transparent 62%);filter:blur(6px);pointer-events:none}
.v2 .pot .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#AEB9E6;font-weight:600}
.v2 .pot .amount{font-family:var(--display);font-weight:800;font-size:31px;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}
.v2 .pot .amount small{font-size:15px;color:#C7CFF0;font-weight:600;margin-left:6px}
.v2 .pot .row{display:flex;align-items:center;gap:8px;margin-top:8px;position:relative;z-index:1;flex-wrap:wrap}
.v2 .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#EAEEFF;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.v2 .chip.gold{background:rgba(232,169,61,.18);border-color:rgba(232,169,61,.4);color:#F2D89B}
.v2 .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--pot-gold)}
/* section label + share */
.v2 .seclabel{display:flex;align-items:baseline;gap:8px;margin:9px 2px 6px}
.v2 .seclabel .t{font-family:var(--display);font-weight:700;font-size:14px}
.v2 .seclabel .r{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:600}
.v2 .sharelink{border:none;background:none;padding:0;color:var(--indigo-600);font-family:var(--body);font-weight:700;font-size:12px;cursor:pointer}
[data-theme="dark"] .v2 .sharelink{color:#9FB0F0}
/* member stamp card */
.v2 .stampcard{background:var(--card);border-radius:20px;padding:6px;box-shadow:var(--shadow-card);margin:0}
.v2 .member{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:5px 9px;border-radius:13px}
.v2 .member + .member{border-top:1px solid var(--line-2)}
.v2 .member.current{background:color-mix(in srgb,var(--indigo-100) 55%,transparent);border-top-color:transparent}
.v2 .member.current + .member{border-top-color:transparent}
.v2 .member.done{opacity:.5}
.v2 .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;flex:none}
.v2 .who{min-width:0}
.v2 .who .nm{font-size:13.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v2 .who .pos{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:1px}
.v2 .who .pos.you{color:var(--pot-gold-deep)}
[data-theme="dark"] .v2 .who .pos.you{color:var(--pot-gold)}
.v2 .stamps{display:flex;gap:6px;justify-self:end}
.v2 .stamp{width:22px;height:22px;border-radius:50%;border:2px solid var(--indigo-100);display:grid;place-items:center;font-size:10px;color:#fff;background:transparent;box-shadow:none}
.v2 .stamp.paid{background:var(--indigo-800);border-color:var(--indigo-800)}
[data-theme="dark"] .v2 .stamp.paid{background:#8FA1EC;border-color:#8FA1EC;color:#0F1B4D}
.v2 .stamp.miss{border-color:var(--miss);color:var(--miss)}
.v2 .stamp.pending{border-style:dashed;border-color:var(--ink-soft);opacity:.5}
.v2 .stamp.you{box-shadow:0 0 0 2.5px var(--pot-gold)}
.v2 .potcoin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#F6C566,var(--pot-gold) 55%,var(--pot-gold-deep));display:grid;place-items:center;font-size:11px;box-shadow:0 0 0 3px rgba(232,169,61,.22),0 2px 6px rgba(185,127,30,.5)}
/* info card (live-only rows) */
.v2 .infocard{background:var(--card);border-radius:18px;padding:6px 15px;box-shadow:var(--shadow-card);margin-top:12px}
.v2 .kv{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13px}
.v2 .kv + .kv{border-top:1px solid var(--line-2)}
.v2 .kv .k{color:var(--ink-soft);font-weight:500}
.v2 .kv .v{font-weight:700;font-family:var(--display)}
.v2 .kv .v small{font-size:11px;color:var(--ink-soft);font-weight:600;margin-left:2px}
/* footer (actionbar) */
.v2.vfoot{background:var(--calico);margin:-14px -20px calc(-16px - env(safe-area-inset-bottom,0px));padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);box-shadow:0 -8px 24px -16px rgba(15,27,77,.25)}
.v2 .footinfo{display:flex;flex-direction:column;align-items:center;gap:3px;margin:0 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line-2);text-align:center}
.v2 .brandline{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-weight:500}
.v2 .brandline b{color:var(--ink);font-weight:700}
.v2 .brandline .flink{text-decoration:none;-webkit-tap-highlight-color:transparent}
.v2 .brandline .flink b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,var(--ink-soft) 55%,transparent)}
.v2 .brandline .flink:active b{color:var(--indigo-600)}
.v2 .brandline .flogo{width:15px;height:15px;border-radius:5px;display:inline-block;background-size:cover;background-position:center}

.v2 .qrow{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:3px}
.v2 .qlink{border:none;background:none;padding:0;color:var(--indigo-600);font-family:var(--body);font-weight:700;font-size:12px;cursor:pointer}
[data-theme="dark"] .v2 .qlink{color:#9FB0F0}
.v2 .walink{border:none;background:none;padding:0;color:#1B9E52;font-family:var(--body);font-weight:700;font-size:12px;cursor:pointer}
[data-theme="dark"] .v2 .walink{color:#4CD98A}
.v2 .theme-toggle{border:none;background:var(--field);color:var(--ink-soft);width:24px;height:24px;border-radius:999px;font-size:13px;display:grid;place-items:center;cursor:pointer;padding:0}

/* --- Join screen (v2join) --- */
/* Join keeps the full-size wordmark (user call, 22 Aug): first screen an
   invitee sees, the brand leads; "You're invited" drops to a subheading. */
#app:has(.v2join) main{padding-bottom:150px}
.v2 .big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin:2px 0 4px}
.v2join .big{margin:6px 0 0;text-align:center;font-size:17px;font-weight:700;color:var(--ink-soft)}
.v2 .invline{font-size:13px;color:var(--ink-soft);font-weight:500;margin:8px 0 12px;text-align:center}
.v2 .invline b{color:var(--ink)}
.v2 .vnote{font-size:12px;color:var(--ink-soft);font-weight:500;margin:0 0 12px;text-align:center;line-height:1.4}
.v2 .steps{display:flex;flex-direction:column;gap:8px;margin-top:2px;padding:7px 0}
.v2 .step{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:start}
.v2 .step .n{width:26px;height:26px;border-radius:9px;background:var(--field);color:var(--indigo-600);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
[data-theme="dark"] .v2 .step .n{color:#9FB0F0}
.v2 .step .txt{font-size:13px;color:var(--ink);line-height:1.35;padding-top:3px}
.v2 .step .txt b{font-weight:700}
.v2 .avrow{display:flex;align-items:center;margin-top:4px}
.v2 .avrow .av{width:30px;height:30px;border-radius:10px;font-size:12px;margin-left:-6px;border:2px solid var(--card)}
.v2 .avrow .av:first-child{margin-left:0}
.v2 .avrow .more{margin-left:8px;font-size:12px;color:var(--ink-soft);font-weight:600}

/* --- Payout celebration (v2pot). Mockup: coin, blue kicker, hero, caption,
   breakdown card; withdraw stays the standard navy primary (gold/blue tried
   and rejected), WA thanks between button and subline. --- */
.v2 .celebrate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px 8px;position:relative;overflow:hidden;min-height:52dvh}
.v2 .celebrate::before{content:'';position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 8%,rgba(232,169,61,.28),transparent 60%);pointer-events:none}
.v2 .confetti{position:absolute;width:8px;height:8px;border-radius:2px;opacity:.85}
.v2 .bigcoin{width:110px;height:110px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 34% 30%,#F8CE72,var(--pot-gold) 52%,var(--pot-gold-deep));display:grid;place-items:center;box-shadow:0 0 0 8px rgba(232,169,61,.18),0 14px 34px -8px rgba(185,127,30,.7);position:relative;z-index:1}
.v2 .bigcoin .fusdcoin{width:100%;height:100%;border-radius:50%;display:block;background-size:cover;background-position:center}
.v2 .celebrate .kicker{position:relative;z-index:1;margin-top:20px;font-size:13px;font-weight:700;color:#1E93AF;letter-spacing:.02em}
[data-theme="dark"] .v2 .celebrate .kicker{color:#5BC9E2}
.v2 .celebrate .hero{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.v2 .celebrate .cap{position:relative;z-index:1;font-size:13.5px;color:var(--ink-soft);font-weight:500;max-width:270px;line-height:1.4}
.v2 .breakdown{position:relative;z-index:1;margin-top:18px;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow-card);width:100%;max-width:280px}
.v2 .kv .v.blue{color:#2FB9D8}
.v2 .wabtn{width:100%;border:none;background:none;min-height:44px;cursor:pointer;font-family:var(--body);font-weight:700;font-size:14px;color:#1B9E52;margin-top:2px}
[data-theme="dark"] .v2 .wabtn{color:#4CD98A}

/* --- Questions (v2faq). Title sits between the emblems (no wordmark);
   the title block stays pinned while only the QA list scrolls;
   Telegram support link always visible. --- */
#app:has(.v2faq) header{display:none}
#app:has(.v2faq) main{padding:0 18px 110px}
.v2faq .faqtop{position:sticky;top:0;z-index:5;background:var(--calico);padding:calc(env(safe-area-inset-top,0px) + 20px) 0 8px;text-align:center}
.v2 .faqhead{font-family:var(--display);font-weight:800;font-size:22px;margin:4px 0 2px;text-align:center}
.v2 .faqsub{font-size:13px;color:var(--ink-soft);font-weight:500;margin:0;text-align:center}
.v2 .tglink{color:#2AA3D6;font-weight:700;text-decoration:none}
[data-theme="dark"] .v2 .tglink{color:#5BC0E8}
.v2 .qa{background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--shadow-card);margin-bottom:9px}
.v2 .qa summary{font-weight:700;font-size:13.5px;cursor:pointer;padding:13px 0;list-style:none;display:flex;align-items:center;gap:9px}
.v2 .qa summary::-webkit-details-marker{display:none}
.v2 .qa summary::before{content:'+';color:var(--pot-gold-deep);font-weight:800;font-size:17px;width:12px;flex:none}
[data-theme="dark"] .v2 .qa summary::before{color:var(--pot-gold)}
.v2 .qa[open] summary::before{content:'\2013'}
.v2 .qa p{margin:0 0 13px;color:var(--ink-soft);font-size:13px;line-height:1.5}
.v2 .qa a{color:var(--indigo-600);font-weight:700}
[data-theme="dark"] .v2 .qa a{color:#9FB0F0}
.v2 .qa a.tglink{color:#2AA3D6}
[data-theme="dark"] .v2 .qa a.tglink{color:#5BC0E8}
.v2 .pay.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1px solid var(--line-2);min-height:48px}
/* pay button + subline */
.v2 .pay{position:relative;width:100%;min-height:54px;border:none;cursor:pointer;border-radius:17px;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--indigo-600),var(--indigo-800));box-shadow:0 8px 20px -8px rgba(27,42,107,.7);display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s ease}
.v2 .pay:active{transform:translateY(1px) scale(.99)}
.v2 .pay .lbl{text-align:center}
.v2 .pay .amt{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;font-size:14px}
.v2 .pay[disabled]{opacity:.6;cursor:default}
.v2 .pay[disabled]:active{transform:none}
.v2 .subline{text-align:center;margin-top:8px;font-size:12px;color:var(--ink-soft);font-weight:500}
</style>
</head>

<script>
/* Storage that never throws: falls back to in-memory if localStorage is
   unavailable (some private-browsing modes / odd webviews). */
const store = (()=>{ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>m[k]??null, setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]} }; } })();

/* ---- theme: dark or light, your choice, remembered ---- */
(function(){
  const saved = store.getItem('circle-theme');
  const prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
/* The toggle now lives inside screen footers (mockup has no header slot),
   so wire by class after each render instead of once at load. */
const themeFace = t => t === 'dark' ? '\u2600' : '\u263e';
function wireTheme(){
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    btn.textContent = themeFace(document.documentElement.getAttribute('data-theme'));
    btn.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      store.setItem('circle-theme', next);
      document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = themeFace(next));
    };
  });
}

/* ============================================================
   Chain adapter.
   DemoChain simulates the RoscaCircle contract so the whole
   lifecycle is clickable today. LiveChain (stub below) is where
   the real wiring goes: build calldata -> digest -> wallet sign
   -> POST /relay. The screens only talk to this interface, so
   swapping demo for live touches nothing else.
   ============================================================ */

/* Same app, different circle. Rotating savings is global — ajo, esusu,
   chama, kitty, hui, tanda, tontine — so the demo speaks more than one
   language. Pick with a URL parameter: ?v=in for the kitty version. */
const PRESETS = {
  ng: {
    kicker: 'Ajo, made safe',
    name: 'Market Women Circle',
    inviter: 'Mama Nkechi',
    members: ['Ada','Bola','Chi','Dayo','Emeka'],
    period: 'week',
  },
  in: {
    kicker: 'Kitty, made safe',
    name: 'Sector 12 Kitty Circle',
    inviter: 'Sharma Aunty',
    members: ['Priya','Anjali','Deepa','Meera','Sunita'],
    period: 'month',
  },
};
const PRESET = PRESETS[new URLSearchParams(location.search).get('v')] || PRESETS.ng;
/* v2 header has no kicker slot; keep the preset write null-safe in case a
   future screen surfaces PRESET.kicker again. */
const _kick = document.querySelector('header .kicker');
if(_kick) _kick.textContent = PRESET.kicker;

function DemoChain(){
  const members = PRESET.members.map((name,i)=>({name, you:i===0}));
  const state = {
    joined:false,
    contribution:10,
    period:PRESET.period,
    size:members.length,
    round:0,                    // current round index
    // paid[r][m] => true/false/null(pending)
    paid: members.map(()=>members.map(()=>null)),
    completed:false,
    justGotPot:false,           // set when a settle credits YOUR pot
    lastPot:0,                  // what actually landed (full or short)
    lastTopUp:0,                // how much of that pot came from the protection
    bond:40,                    // organizer's protection, posted before anyone joined
    bondRemaining:40,           // drops when it tops up a short pot
    balance:25,                 // fUSD in your account
    guardians:null,             // null = protection not set up yet
    recovery:null,              // pending recovery of a FRIEND's account
  };
  // pre-simulate: some others already paid this week
  state.paid[0] = [null,true,true,null,null];

  const yourIndex = 0;

  function allPaid(r){ return state.paid[r].every(p=>p===true); }
  function settle(){
    // nulls become misses, advance round
    state.paid[state.round] = state.paid[state.round].map(p=>p===true?true:false);
    state.round++;
    if(state.round>=state.size){ state.completed=true; return; }
    state.paid[state.round] = members.map(()=>null);
  }

  return {
    demo:true,
    yourIndex,
    getCircle(){ return {
      name:PRESET.name,
      members: members.map(m=>m.name),
      you: yourIndex,
      contribution: state.contribution,
      period: state.period,
      size: state.size,
      round: state.round,
      paid: state.paid,
      joined: state.joined,
      completed: state.completed,
      pot: state.contribution*state.size,
      balance: state.balance,
      recipient: state.round<state.size ? state.round : null,
      daysLeft: 3,
      justGotPot: state.justGotPot,
      lastPot: state.lastPot,
      lastTopUp: state.lastTopUp,
      bond: state.bond,
      bondRemaining: state.bondRemaining,
    };},
    ackPot(){ state.justGotPot = false; },
    async join(){ state.joined=true; },
    async contribute(){
      /* LIVE: batch [approve(circle,amount), contribute()] on the
         member's MinimalAccount -> sign digest -> POST /relay */
      if(state.balance < state.contribution) return; // real contract would revert
      state.paid[state.round][yourIndex]=true;
      state.balance -= state.contribution;
      // demo nicety: if everyone else already paid, auto-settle like the contract
      if(allPaid(state.round)){
        if(state.round===yourIndex){
          state.balance += state.contribution*state.size;
          state.lastPot = state.contribution*state.size;
          state.lastTopUp = 0;
          state.justGotPot = true;
        }
        settle();
      }
    },
    /* demo-only controls */
    _othersPay(){
      state.paid[state.round] = state.paid[state.round].map((p,i)=> i===yourIndex? p : true);
      if(allPaid(state.round)){
        if(state.round===yourIndex){
          state.balance += state.contribution*state.size;
          state.lastPot = state.contribution*state.size;
          state.lastTopUp = 0;
          state.justGotPot = true;
        }
        settle();
      }
    },
    _someoneMisses(){
      // everyone but you and one member pays; deadline passes; the round
      // settles SHORT — and the organizer's protection tops the pot up,
      // exactly like the contract: recipient made whole, bond drops,
      // the miss goes on the card, the misser now owes the organizer.
      state.paid[state.round] = state.paid[state.round].map((p,i)=>{
        if(i===yourIndex) return p===true;
        if(i===3) return false;
        return true;
      });
      const topUp = Math.min(state.contribution, state.bondRemaining);
      state.bondRemaining -= topUp;
      if(state.round===yourIndex && state.paid[state.round][yourIndex]){
        const landed = state.contribution*(state.size-1) + topUp;
        state.balance += landed;
        state.lastPot = landed;          // full pot while protection lasts
        state.lastTopUp = topUp;
        state.justGotPot = true;
      }
      settle();
    },
    /* ---- safety: guardians, recovery, backup ---- */
    getSafety(){ return {
      guardians: state.guardians,
      recovery: state.recovery,
      phrase: 'maple lantern drum river cocoa sunset basket loyal candle iron velvet home',
    };},
    async setGuardians(idxs){ state.guardians = idxs; },
    async approveRecovery(){
      const r = state.recovery;
      if(!r || r.youApproved) return;
      r.youApproved = true;
      r.approvals++;
      if(r.approvals >= r.needed) r.waitDays = 3; // veto window starts
    },
    /* demo-only controls */
    _friendLosesPhone(){
      state.recovery = { memberIdx:3, approvals:2, needed:3, youApproved:false, waitDays:null };
    },
    _reset(){ location.reload(); }
  };
}

/* ============================================================
   LiveChain — the real wiring for ZEL. Architecture and findings
   in docs/SIGNING.md. Summary of the design:

   The Zano mobile wallet signs with CryptoNote ed25519 keys, which
   ecrecover cannot verify, so it CANNOT sign our batches. Instead the
   app generates its own secp256k1 key on first run; that key is the
   MinimalAccount owner and silently signs every action (one tap, no
   popup). The Zano wallet keeps two jobs: moving fUSD across the L1
   privacy boundary to the account's CREATE2 address, and proving the
   user's alias to the relayer once via window.zano REQUEST_MESSAGE_SIGN.

   To go live: replace `const LIVE = null` with real values. Demo mode
   remains the default while LIVE is null.
   ============================================================ */

const LIVE = null;
/* const LIVE = {
  rpcUrl:    'https://<zel-testnet-rpc>',
  relayerUrl:'http://localhost:3000',
  circleAddr:'0x<RoscaCircle>',
  fusdAddr:  '0x<bridged fUSD>',
  circleName:'<the REAL circle name, agreed with members — never the preset one>',
}; */

async function LiveChain(cfg){
  const E = window.ethers;
  if(!E) throw new Error('ethers failed to load');
  const provider = new E.JsonRpcProvider(cfg.rpcUrl);

  const CIRCLE_ABI = [
    'function state() view returns (uint8)',
    'function currentRound() view returns (uint16)',
    'function roundStart() view returns (uint256)',
    'function periodLength() view returns (uint256)',
    'function gracePeriod() view returns (uint256)',
    'function contribution() view returns (uint256)',
    'function circleSize() view returns (uint16)',
    'function rotation(uint256) view returns (address)',
    'function memberStatus(address) view returns (bool,uint16,bool,uint256)',
    'function join()',
    'function contribute()',
    'event ContributionMade(address indexed member, uint16 indexed round, uint256 amount)',
    'event RoundSettled(uint16 indexed round, address indexed recipient, uint256 amountPaid, uint16 missedCount)',
  ];
  const ERC20_ABI = [
    'function balanceOf(address) view returns (uint256)',
    'function decimals() view returns (uint8)',
    'function approve(address,uint256) returns (bool)',
  ];
  const ACCOUNT_ABI = [
    'function nonce() view returns (uint256)',
    'function batchDigest(address[],uint256[],bytes[],uint256) view returns (bytes32)',
  ];

  /* ---- the in-app owner key (see docs/SIGNING.md: key custody) ---- */
  const KEY_SLOT = 'circle-owner-key';
  const PHRASE_SLOT = 'circle-owner-phrase';
  let pk = store.getItem(KEY_SLOT);
  if(!pk){
    const w = E.Wallet.createRandom();
    pk = w.privateKey;
    store.setItem(KEY_SLOT, pk);
    store.setItem(PHRASE_SLOT, w.mnemonic.phrase); // backup words for the safety screen
  }
  const owner = new E.Wallet(pk);
  // TODO(v1 UI): a one-time backup screen for this key. Required until
  // social recovery ships — a lost phone is a lost key.

  async function post(url, body){
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || 'request failed');
    return j;
  }

  /* ---- onboard: relayer deploys the account lazily (CREATE2) ----
     The relayer requires proof of key possession: an EIP-191 signature over
     a fresh `zano-circle:onboard:<owner>:<ts>` message (see relayer.js). */
  const obMessage = `zano-circle:onboard:${owner.address}:${Date.now()}`;
  const obSignature = await owner.signMessage(obMessage);
  const { account } = await post(cfg.relayerUrl + '/onboard',
    { owner: owner.address, message: obMessage, signature: obSignature });
  console.info('[circle] your account (fUSD deposit address on ZEL):', account);

  const circle = new E.Contract(cfg.circleAddr, CIRCLE_ABI, provider);
  const fusd   = new E.Contract(cfg.fusdAddr,  ERC20_ABI,  provider);
  const acct   = new E.Contract(account,        ACCOUNT_ABI, provider);

  /* ---- optional: prove the Zano alias to the relayer, once ----
     Response shape of REQUEST_MESSAGE_SIGN must be verified on a real
     device (docs/SIGNING.md "to verify"). Failure here is non-fatal:
     the app just shows short addresses instead of aliases. */
  async function linkAlias(){
    if(!window.zano || store.getItem('circle-alias-linked')) return;
    try {
      const message = `zano-circle:link:${account}:${Date.now()}`;
      const res = await window.zano.request('REQUEST_MESSAGE_SIGN', { message }, 60_000);
      if(res && !res.error){
        await post(cfg.relayerUrl + '/link-alias', { account, message, response: res });
        store.setItem('circle-alias-linked', '1');
      }
    } catch(e){ console.warn('alias link skipped:', e.message); }
  }
  linkAlias();

  /* ---- sign + relay: one signature, whole batch, zero gas ---- */
  async function signAndRelay(calls){
    const targets = calls.map(c => c.to);
    const values  = calls.map(() => 0n);
    const datas   = calls.map(c => c.data);
    const nonce   = await acct.nonce();
    // The CONTRACT computes the digest (single source of truth for hashing).
    const digest  = await acct.batchDigest(targets, values, datas, nonce);
    // CRITICAL: batchDigest is already EthSignedMessage-prefixed. Sign it RAW.
    // owner.signMessage(digest) would prefix twice and fail verification.
    const sig = E.Signature.from(owner.signingKey.sign(digest)).serialized;
    await post(cfg.relayerUrl + '/relay', {
      account, targets, datas, signature: sig,
      values: values.map(v => v.toString()),
    });
  }

  /* ---- state snapshot the screens render from ---- */
  let decimals = 18, snap = null, members = [], names = [];
  const POT_ACK = 'circle-pot-acked:' + cfg.circleAddr;

  function shortAddr(a){ return a.slice(0,6) + '…' + a.slice(-4); }
  /* Escape any untrusted string before it goes into innerHTML. Member names
     come from the relayer's /aliases endpoint, which is external input we do
     not control: a hostile relayer could otherwise return HTML/JS that runs
     in this origin, where the account signing key lives. Neutralize it. */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  async function refresh(){
    const [stateN, roundN, sizeN, contribWei, roundStart, periodLen] = await Promise.all([
      circle.state(), circle.currentRound(), circle.circleSize(),
      circle.contribution(), circle.roundStart(), circle.periodLength(),
    ]);
    const size = Number(sizeN), round = Number(roundN), state = Number(stateN);

    if(members.length !== size){
      members = [];
      for(let i = 0; i < size; i++) members.push(await circle.rotation(i));
      try {
        const r = await fetch(cfg.relayerUrl + '/aliases?accounts=' + members.join(','));
        const j = await r.json();
        names = members.map(a => escapeHtml(j[a.toLowerCase()] || shortAddr(a)));
      } catch { names = members.map(shortAddr); }
      try { decimals = Number(await fusd.decimals()); } catch {}
    }

    const you = members.findIndex(a => a.toLowerCase() === account.toLowerCase());
    const [joined, , paidNow] = you >= 0
      ? await circle.memberStatus(account) : [false, 0, false];

    /* stamp-card history from events */
    const paid = Array.from({length:size}, () => Array(size).fill(null));
    const made = await circle.queryFilter(circle.filters.ContributionMade());
    for(const ev of made){
      const mi = members.findIndex(a => a.toLowerCase() === ev.args.member.toLowerCase());
      const r = Number(ev.args.round);
      if(mi >= 0 && r < size) paid[r][mi] = true;
    }
    const settledRounds = state === 2 ? size : round; // Completed => all settled
    for(let r = 0; r < settledRounds; r++)
      for(let m = 0; m < size; m++)
        if(paid[r][m] !== true) paid[r][m] = false;   // settled + unpaid = missed

    /* pot detection: my payout round has settled and I haven't seen it */
    let justGotPot = false, lastPot = 0;
    if(you >= 0 && (state === 2 || round > you) && store.getItem(POT_ACK) !== String(you)){
      const settled = await circle.queryFilter(circle.filters.RoundSettled(you));
      if(settled.length){
        justGotPot = true;
        lastPot = Number(E.formatUnits(settled[0].args.amountPaid, decimals));
      }
    }

    const bal = await fusd.balanceOf(account);
    const contribution = Number(E.formatUnits(contribWei, decimals));
    const secsLeft = Number(roundStart) + Number(periodLen) - Math.floor(Date.now()/1000);
    const pl = Number(periodLen);

    /* ---- safety state: my guardians + any friend's pending recovery ---- */
    const ACCT_SAFETY_ABI = [
      'function guardians() view returns (address[])',
      'function proposedOwner() view returns (address)',
      'function recoveryApprovals() view returns (uint256)',
      'function approvalsNeeded() view returns (uint256)',
      'function recoveryReadyAt() view returns (uint256)',
      'function approvedRecovery(address) view returns (bool)',
    ];
    let safety = { guardians: null, recovery: null, phrase: store.getItem(PHRASE_SLOT) || '' };
    try {
      const mine = new E.Contract(account, ACCT_SAFETY_ABI, provider);
      const gs = await mine.guardians();
      if(gs.length) safety.guardians = gs.map(g => members.findIndex(a => a.toLowerCase() === g.toLowerCase())).filter(i => i >= 0);
      // scan fellow members for a pending recovery I could approve
      for(let i = 0; i < size; i++){
        if(i === you) continue;
        const fa = new E.Contract(members[i], ACCT_SAFETY_ABI, provider);
        const proposed = await fa.proposedOwner();
        if(proposed !== E.ZeroAddress){
          const [appr, need, readyAt, iApproved] = await Promise.all([
            fa.recoveryApprovals(), fa.approvalsNeeded(), fa.recoveryReadyAt(),
            fa.approvedRecovery(account),
          ]);
          safety.recovery = {
            memberIdx: i, newOwner: proposed,
            approvals: Number(appr), needed: Number(need),
            youApproved: Boolean(iApproved),
            waitDays: Number(readyAt) > 0
              ? Math.max(0, Math.ceil((Number(readyAt) - Date.now()/1000) / 86400)) : null,
          };
          break; // one at a time is enough for the UI
        }
      }
    } catch(e){ console.warn('safety scan:', e.message); }

    snap = {
      name: cfg.circleName || 'Your circle',
      members: names, you: Math.max(you, 0), size, round, paid,
      contribution, pot: contribution * size,
      period: pl >= 6*86400 ? 'week' : pl >= 86400 ? 'day' : 'round',
      joined: Boolean(joined), completed: state === 2,
      balance: Number(E.formatUnits(bal, decimals)),
      recipient: state === 1 && round < size ? round : null, // rotation order = payout order
      daysLeft: Math.max(0, Math.ceil(secsLeft / 86400)),
      justGotPot, lastPot,
      _paidNow: Boolean(paidNow),
      _safety: safety,
    };
    return snap;
  }

  await refresh();
  setInterval(async () => { try { await refresh(); render(); } catch {} }, 15_000);

  const amount = () => E.parseUnits(String(snap.contribution), decimals);

  return {
    demo: false,
    get yourIndex(){ return snap.you; },
    getCircle(){ return snap; },
    ackPot(){ store.setItem(POT_ACK, String(snap.you)); snap.justGotPot = false; },
    async join(){
      await signAndRelay([
        { to: cfg.fusdAddr,  data: fusd.interface.encodeFunctionData('approve', [cfg.circleAddr, amount()]) },
        { to: cfg.circleAddr, data: circle.interface.encodeFunctionData('join') },
      ]);
      await refresh();
    },
    async contribute(){
      await signAndRelay([
        { to: cfg.fusdAddr,  data: fusd.interface.encodeFunctionData('approve', [cfg.circleAddr, amount()]) },
        { to: cfg.circleAddr, data: circle.interface.encodeFunctionData('contribute') },
      ]);
      await refresh();
    },

    /* ---- safety: guardians, recovery, backup (MinimalAccount v2) ---- */
    getSafety(){ return snap._safety; },
    async setGuardians(idxs){
      const gs = idxs.map(i => members[i]);
      const me = new E.Contract(account, [
        'function setGuardians(address[])',
      ], provider);
      await signAndRelay([
        { to: account, data: me.interface.encodeFunctionData('setGuardians', [gs]) },
      ]);
      await refresh();
    },
    async approveRecovery(){
      const r = snap._safety.recovery;
      if(!r || r.youApproved) return;
      const friend = members[r.memberIdx];
      const fa = new E.Contract(friend, [
        'function approveRecovery(address)',
      ], provider);
      await signAndRelay([
        { to: friend, data: fa.interface.encodeFunctionData('approveRecovery', [r.newOwner]) },
      ]);
      await refresh();
    },
    _reset(){ location.reload(); },
  };
}

function fmt$(n){ return `$${n}<small>fUSD</small>`; }
/* Same escaper LiveChain uses internally, hoisted for templates outside that
   closure (F6: backup words render into innerHTML). */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* F-5: on a live circle that is still Joining, `recipient` is null
   (payouts start with Active), so c.members[c.recipient] rendered
   "undefined" in every who-collects string. Rotation order equals
   payout order, so member 0 is always the first collector; fall back
   to that, and to a positional label if the members list is short. */
function recipientName(c){
  const i = (c.recipient == null) ? 0 : c.recipient;
  return c.members[i] ?? ('Member ' + (i + 1));
}

/* ============================================================
   Share pack. The chat is where the circle already lives -
   WhatsApp, Signal, Telegram, whatever the group uses - so the
   app hands it ready made moments: the card as an image, one
   tap messages, and an invite link. The app stays the ledger,
   the chat can say anything, the card is the truth.
   Nothing here talks to any chat service: the phone's own
   share sheet, or the clipboard for manual pasting, that's all.
   ============================================================ */

/* The link that travels with every message. Live circles carry their
   address (?c=...) so the receiver lands on THIS circle; the demo
   shares itself, preset included. */
function circleLink(){
  if(LIVE && LIVE.circleAddr){
    const v = new URLSearchParams(location.search).get('v');
    return location.origin + location.pathname + '?c=' + LIVE.circleAddr + (v ? '&v=' + v : '');
  }
  const v = new URLSearchParams(location.search).get('v');
  return location.origin + location.pathname + (v ? '?v=' + v : '');
}

function shareText(text){
  if(navigator.share){
    navigator.share({text}).catch(e=>{
      if(!e || e.name !== 'AbortError') copyText(text);
    });
  } else {
    copyText(text);
  }
}

function copyText(text){
  const done = ()=>toast('Copied \u2014 paste it in any chat');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, ()=>{ if(legacyCopy(text)) done(); });
  } else if(legacyCopy(text)){
    done();
  }
}

function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

let toastTimer = null;
function toast(msg){
  let t = document.getElementById('app-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'app-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Moment copy. Plain sentences, both presets covered by reading
   the period and names from the circle itself. */
function msgPaid(c, round){
  return `I paid my $${c.contribution} for ${c.period} ${round+1} of ${c.size} \u2713 My stamp is on the card. ${circleLink()}`;
}
function msgPot(c){
  const next = c.completed ? null : recipientName(c);
  return `The pot landed today, $${c.lastPot || c.pot} \u{1F31F} Thank you all.`
    + (next ? ` Next ${c.period} it goes to ${next}.` : ` That was the last pot, our circle is complete.`)
    + ` ${circleLink()}`;
}
function msgInvite(c){
  return `Our savings circle runs here. ${c.size} people, everyone puts in $${c.contribution} each ${c.period}, and the whole pot goes to one member in turn. No one holds the money in between. See the card: ${circleLink()}`;
}

/* ---- the stamp card as a shareable image ----
   Drawn by hand on a canvas (no libraries, works offline) in the
   light palette so the shared card looks the same from every phone.
   This IS the badge people show off, so it carries the brand. */
function cardImageBlob(c){
  const P = {
    bg:'#FAF6EE', line:'#EFE9DC',
    indigo:'#1B2A6B', ink:'#141726', soft:'#4A4F63',
    lite:'#DDE2F4', gold:'#E8A93D', goldDeep:'#B97F1E', goldLite:'#F6C566',
    miss:'#B3432B', onIndigo:'#FAF6EE', onIndigoSoft:'#C9D2F2',
  };
  const W = 1000, pad = 44, nameW = 250, rowH = 82;
  const headH = 168, legendH = 60, footH = 76;
  const H = headH + 26 + c.size*rowH + legendH + footH;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  x.fillStyle = P.bg; x.fillRect(0, 0, W, H);

  /* header */
  x.fillStyle = P.indigo; x.fillRect(0, 0, W, headH - 12);
  x.fillStyle = P.onIndigoSoft;
  x.font = '600 20px system-ui, sans-serif';
  x.textBaseline = 'alphabetic';
  x.fillText(PRESET.kicker.toUpperCase(), pad, 56);
  x.fillStyle = P.onIndigo;
  x.font = '800 44px system-ui, sans-serif';
  x.fillText(c.name, pad, 108);
  x.font = '600 22px system-ui, sans-serif';
  x.fillStyle = P.onIndigoSoft;
  const wk = c.completed ? `all ${c.size} ${c.period}s complete` : `${c.period} ${c.round+1} of ${c.size}`;
  x.fillText(wk, pad, 142);
  /* adire resist dots under the header */
  x.fillStyle = P.onIndigo;
  for(let dx = 12; dx < W; dx += 26){
    x.beginPath(); x.arc(dx, headH - 6, 3.4, 0, Math.PI*2); x.fill();
  }

  /* stamp helpers */
  const R = 20;
  function stampAt(cx, cy, kind){
    x.setLineDash([]);
    if(kind === 'paid'){
      x.fillStyle = P.indigo;
      x.beginPath(); x.arc(cx, cy, R, 0, Math.PI*2); x.fill();
      x.fillStyle = '#FFFFFF';
      x.font = '700 22px system-ui, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('\u2713', cx, cy + 1);
    } else if(kind === 'missed'){
      x.strokeStyle = P.miss; x.lineWidth = 3;
      x.beginPath(); x.arc(cx, cy, R - 1.5, 0, Math.PI*2); x.stroke();
      x.fillStyle = P.miss;
      x.font = '700 20px system-ui, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('\u2715', cx, cy + 1);
    } else if(kind === 'pot'){
      const g = x.createRadialGradient(cx - 6, cy - 7, 2, cx, cy, R);
      g.addColorStop(0, P.goldLite); g.addColorStop(.55, P.gold); g.addColorStop(1, P.goldDeep);
      x.fillStyle = g;
      x.beginPath(); x.arc(cx, cy, R, 0, Math.PI*2); x.fill();
      x.fillStyle = '#3A2705';
      x.font = '700 20px system-ui, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('\u2605', cx, cy + 1);
    } else { /* pending */
      x.strokeStyle = P.lite; x.lineWidth = 3;
      x.setLineDash([5, 5]);
      x.beginPath(); x.arc(cx, cy, R - 1.5, 0, Math.PI*2); x.stroke();
      x.setLineDash([]);
    }
    x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  }

  /* rows */
  const rowsTop = headH + 20;
  const cellW = (W - pad*2 - nameW) / c.size;
  for(let mi = 0; mi < c.size; mi++){
    const y = rowsTop + mi*rowH;
    if(!c.completed && mi === c.recipient){
      x.fillStyle = P.lite;
      if(x.roundRect){ x.beginPath(); x.roundRect(pad - 14, y + 4, W - pad*2 + 28, rowH - 8, 14); x.fill(); }
      else x.fillRect(pad - 14, y + 4, W - pad*2 + 28, rowH - 8);
    }
    x.fillStyle = P.ink;
    x.font = '700 26px system-ui, sans-serif';
    x.fillText(c.members[mi] + (mi === c.you ? ' (you)' : ''), pad, y + 38);
    x.fillStyle = P.soft;
    x.font = '600 18px system-ui, sans-serif';
    x.fillText('pot ' + ordinal(mi + 1), pad, y + 64);

    for(let r = 0; r < c.size; r++){
      const cx = pad + nameW + r*cellW + cellW/2;
      const cy = y + rowH/2;
      const isPotHolder = r === mi;
      if(r > c.round && !c.completed){ stampAt(cx, cy, 'pending'); continue; }
      if(isPotHolder && (r < c.round || c.completed)){ stampAt(cx, cy, 'pot'); continue; }
      const p = c.paid[r] ? c.paid[r][mi] : null;
      if(p === true) stampAt(cx, cy, 'paid');
      else if(p === false) stampAt(cx, cy, 'missed');
      else stampAt(cx, cy, 'pending');
    }
  }

  /* legend */
  const ly = rowsTop + c.size*rowH + 34;
  let lx = pad;
  function legend(kind, label){
    stampAt(lx + 12, ly - 7, kind);
    x.fillStyle = P.soft;
    x.font = '600 20px system-ui, sans-serif';
    x.fillText(label, lx + 32, ly);
    lx += 32 + x.measureText(label).width + 40;
  }
  legend('paid', 'paid'); legend('missed', 'missed'); legend('pot', 'pot');

  /* footer */
  x.strokeStyle = P.line; x.lineWidth = 2;
  x.beginPath(); x.moveTo(pad, ly + 26); x.lineTo(W - pad, ly + 26); x.stroke();
  x.fillStyle = P.soft;
  x.font = '600 19px system-ui, sans-serif';
  x.textAlign = 'center';
  x.fillText(PRESET.kicker + ' \u00b7 powered by Zano', W/2, ly + 60);
  x.textAlign = 'left';

  return new Promise(res => cv.toBlob(res, 'image/png'));
}

async function shareCard(c){
  try{
    const blob = await cardImageBlob(c);
    if(!blob) throw new Error('no image');
    const file = new File([blob], 'circle-card.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], text: 'Our circle so far. ' + circleLink() }); return; }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    /* No share sheet (desktop, older webview): save the image so it can
       be attached by hand, and open the chat with the message ready. */
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'circle-card.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    shareText('Our circle so far. ' + circleLink());
  }catch(e){
    shareText('Our circle so far. ' + circleLink());
  }
}

function wireShare(){
  const s = document.getElementById('share-card');
  if(s) s.onclick = () => shareCard(chain.getCircle());
  const inv = document.getElementById('invite-row');
  if(inv) inv.onclick = () => shareText(msgInvite(chain.getCircle()));
  const cp = document.getElementById('copy-invite');
  if(cp) cp.onclick = () => copyText(msgInvite(chain.getCircle()));
}

function render(){
  const c = chain.getCircle();
  /* header is the shared wordmark now (v2); circle name lives in screen copy */
  if(!c.joined) return screenJoin(c);
  if(c.completed) return screenDone(c);
  if(c.justGotPot) return screenPot(c);   // shown once, when the pot has actually LANDED
  const youPaid = c.paid[c.round][c.you]===true;
  return screenHome(c, youPaid);
}

/* ---------- 1. Join ---------- */
function screenJoin(c){
  /* Invite arrivals (?c=) get neutral copy plus the circle address.
     PRESET.inviter comes from ?v= in the same link, so an attacker can
     write any name into it; never let it vouch for an invited circle.
     F-4: the preset line is demo-only — a live circle opened WITHOUT an
     invite (bare link, organizer's own device) must not claim the preset
     inviter/name either. INVITE_ADDR is validated hex, safe in markup. */
  const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
  const sub = (INVITE_ADDR || LIVE_ACTIVE)
    ? `You have been invited to this circle. Check everything looks right, then join.`
    : `${PRESET.inviter} invited you to join <b>${c.name}</b>.`;
  const lastRow = INVITE_ADDR
    ? `<div class="kv"><span class="k">Circle address</span><span class="v">${shortInvite()}</span></div>`
    : c.bond ? `<div class="kv"><span class="k">Organizer bond</span><span class="v">$${c.bond} protected</span></div>` : '';
  const verifyNote = INVITE_ADDR
    ? `<div class="vnote">This invite link opened the circle at ${shortInvite()}. Check the address with your organizer before you join.</div>`
    : '';
  const others = c.members.map((n,mi)=>({n,mi})).filter(o=>o.mi!==c.you);
  main.innerHTML = `
  <section class="screen active v2 v2join">
    <div class="big">You're invited</div>
    <div class="invline">${sub}</div>
    ${verifyNote}
    <div class="infocard" style="margin:0 0 12px">
      <div class="kv"><span class="k">You pay</span><span class="v">$${c.contribution} each ${c.period}</span></div>
      <div class="kv"><span class="k">Circle size</span><span class="v">${c.size} people \u00b7 ${c.size} ${c.period}s</span></div>
      <div class="kv"><span class="k">Your turn</span><span class="v">${cap(c.period)} ${c.you+1} \u00b7 collect $${c.pot}</span></div>
      ${lastRow}
    </div>
    <div class="seclabel"><span class="t">How it works</span></div>
    <div class="infocard" style="margin:0 0 12px">
      <div class="steps">
        <div class="step"><div class="n">1</div><div class="txt">Everyone pays <b>$${c.contribution}</b> into the circle each ${c.period}.</div></div>
        <div class="step"><div class="n">2</div><div class="txt">Each ${c.period} one person collects the <b>whole $${c.pot} pot</b>. You collect in ${c.period} ${c.you+1}.</div></div>
        <div class="step"><div class="n">3</div><div class="txt">After ${c.size} ${c.period}s everyone has had their turn. No one holds the money; the contract does.</div></div>
      </div>
    </div>
    <div class="seclabel"><span class="t">Who's already in</span><span class="r">${others.length} of ${c.size}</span></div>
    <div class="avrow">
      ${others.map(o=>`<div class="av" style="background:${AV_GRADS[o.mi%AV_GRADS.length]}">${o.n.charAt(0).toUpperCase()}</div>`).join('')}
      <span class="more">+ you makes ${c.size}</span>
    </div>
  </section>`;
  actionbar.innerHTML = `<div class="v2 vfoot">
    <div class="qrow" style="margin:0 0 7px"><button class="qlink" id="faq-link">Questions &amp; help \u203a</button></div>
    <button class="pay" id="act"><span class="lbl">Join this circle</span></button>
    <div class="subline">You'll confirm in your Zano wallet \u00b7 no gas fees to join</div>
  </div>`;
  document.getElementById('act').onclick = async ()=>{ await chain.join(); render(); };
  document.getElementById('faq-link').onclick = ()=>screenFaq(c);
}

  const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
  main.innerHTML = `
  <section class="screen active v2 v2home">
    ${recoveryAlert(c, s)}
    <div class="pot">
      <div class="eyebrow">This ${c.period}'s pot</div>
      <div class="amount">$${c.pot}<small>fUSD</small></div>
      <div class="row"><span class="chip gold"><span class="dot"></span>Collecting: ${yourWeek?'You':who}</span>${c.bond?`<span class="chip">Protected \u00b7 $${c.bondRemaining}</span>`:''}</div>

    ? `<button class="pay" disabled><span class="lbl">Paid for this ${c.period} \u2713</span></button>`

      : `<button class="pay" id="act"><span class="lbl">Pay this ${c.period}</span><span class="amt">${'$'+c.contribution}</span></button>`;
  actionbar.innerHTML = `<div class="v2 vfoot">
    <div class="footinfo">
      <div class="brandline"><i class="flogo mk-f" role="img" aria-label="fUSD"></i><a class="flink" href="https://freedomdollar.com" target="_blank" rel="noopener"><b>Freedom Dollar</b></a><span>\u00b7 powered by</span><i class="flogo mk-z" role="img" aria-label="Zano"></i><a class="flink" href="https://zano.org" target="_blank" rel="noopener"><b>Zano</b></a></div>

/* Member rows, mockup style: avatar, name, plain-words status, and stamps
   for the weeks so far (mockup shows no upcoming columns). Rotation order
   is member order in v1, same rule as before. */
const AV_GRADS = ['linear-gradient(135deg,#6B76B8,#41508F)','linear-gradient(135deg,#C77FA6,#9C5C86)','linear-gradient(135deg,#E0A94A,#B97F1E)','linear-gradient(135deg,#4FA3B8,#2E7688)','linear-gradient(135deg,#8E7BC4,#5F4E9C)','linear-gradient(135deg,#5B9E6F,#3B7A50)'];
function memberCard(c){
  const cap = w => w.charAt(0).toUpperCase()+w.slice(1);
  const rows = c.members.map((name,mi)=>{
    const isYou = mi===c.you;
    const gotPot = mi < c.round || c.completed;      // rotation order == member order in v1
    const isCurrent = !c.completed && mi===c.recipient;
    const pos = gotPot ? `Got the pot \u00b7 ${c.period} ${mi+1}`
      : isCurrent ? `Collecting now \u00b7 ${c.period} ${mi+1}`
      : isYou ? `Your turn \u00b7 ${c.period} ${mi+1}`
      : `${cap(c.period)} ${mi+1}`;
    const stamps = [];
    for(let r=0;r<=c.round;r++){
      if(r===mi){ stamps.push(`<span class="stamp potcoin" title="${name}'s pot" aria-label="${name}'s pot ${c.period}">\u2605</span>`); continue; }
      const p = c.paid[r]?.[mi];
      if(p===true) stamps.push(`<span class="stamp paid ${isYou?'you':''}" aria-label="paid">\u2713</span>`);
      else if(p===false) stamps.push(`<span class="stamp miss" aria-label="missed">!</span>`);
      else stamps.push(`<span class="stamp pending ${isYou?'you':''}" aria-label="not paid yet"></span>`);
    }
    return `<div class="member ${isCurrent?'current':''} ${gotPot?'done':''}">
      <div class="av" style="background:${AV_GRADS[mi%AV_GRADS.length]}">${name.charAt(0).toUpperCase()}</div>
      <div class="who"><div class="nm">${name}${isYou?' (you)':''}</div><div class="pos ${isYou&&!gotPot&&!isCurrent?'you':''}">${pos}</div></div>
      <div class="stamps">${stamps.join('')}</div>
    </div>`;
  }).join('');
  return `<div class="stampcard">${rows}</div>`;
}

/* Alert card when a fellow member's new phone needs your OK. */
function recoveryAlert(c, s){
  const r = s && s.recovery;
  if(!r) return '';
  const who = c.members[r.memberIdx];
  if(r.youApproved){
    const done = r.approvals >= r.needed;
    return `<div class="status" style="margin-top:0">
      <div class="big">${who}'s new phone: you said yes ✓</div>
      <div class="small">${done
        ? `Enough of the circle agreed. After a 3 day wait, ${who} is back with the same savings and the same card.`
        : `${r.approvals} of ${r.needed} so far, waiting on others.`}</div>
    </div>`;
  }
  return `<div class="status gold" style="margin-top:0">
    <div class="big">${who} lost their phone</div>
    <div class="small">They need ${r.needed} circle members to welcome their new phone. ${r.approvals} said yes so far.</div>
    <button class="btn btn-primary" id="recovery-cta" style="margin-top:12px;min-height:48px;font-size:16px">Help ${who} get back in</button>
  </div>`;
}

function statusStrip(c, youPaid, paidCount){
  const who = recipientName(c);
  const yourWeek = c.recipient===c.you;
  if(yourWeek){
    return `<div class="status gold">
      <div class="big">Your pot ${c.period}. Pay your share to keep it moving</div>
      <div class="small">${paidCount} of ${c.size} have paid · ${c.daysLeft} days left</div>
    </div>`;
  }
  return `<div class="status">
    <div class="big">${who}'s pot this ${c.period}</div>
    <div class="small">${paidCount} of ${c.size} have paid · ${c.daysLeft} days left${youPaid?'':' · your turn to pay'}</div>
  </div>`;
}

function stampCard(c){
  const rows = c.members.map((name,mi)=>{
    const isYou = mi===c.you;
    const stamps = [];
    for(let r=0;r<c.size;r++){
      const isPotHolder = r===mi;   // rotation order == member order in v1
      if(r>c.round){ stamps.push(`<span class="stamp pending" aria-label="upcoming"></span>`); continue; }
      const p = c.paid[r]?.[mi];
      // The coin means the pot LANDED: settled rounds only. During the
      // recipient's own live week they get a normal stamp like everyone
      // else (they pay too); the coin stamps in at settlement.
      if(isPotHolder && (r<c.round || c.completed)){
        stamps.push(`<span class="potcoin" title="${name}'s pot" aria-label="${name}'s pot week">★</span>`);
        continue;
      }
      if(p===true) stamps.push(`<span class="stamp paid ${isYou?'you':''}" aria-label="paid">✓</span>`);
      else if(p===false) stamps.push(`<span class="stamp missed" aria-label="missed">✕</span>`);
      else stamps.push(`<span class="stamp pending ${isYou?'you':''}" aria-label="not paid yet"></span>`);
    }
    return `<div class="stamprow ${mi===c.recipient?'current':''}">
      <div class="who">${name}${isYou?' (you)':''}<span class="pos">pot ${ordinal(mi+1)}</span></div>
      <div class="stamps">${stamps.join('')}</div>
    </div>`;
  }).join('');
  return `<div class="stampcard">
    <div class="title"><span class="t">Contribution card</span><span class="wk">${c.completed ? `all ${c.size} ${c.period}s` : `${c.period} ${c.round+1} of ${c.size}`}</span><button class="sharebtn" id="share-card" aria-label="Share this card">Share ›</button></div>
    ${rows}
    <div class="legend">
      <span><i class="l-paid"></i>paid</span>
      <span><i class="l-miss"></i>missed</span>
      <span><i class="l-pot"></i>pot</span>
    </div>
  </div>`;
}

/* ---------- 4. Pot week ---------- */
function screenPot(c){
  const landed = c.lastPot || c.pot;
  /* Caption keeps all three HEAD cases (protection top-up, a short pot,
     the full pot) with the mockup's full-pot wording dynamicized. */
  const cap = c.lastTopUp > 0
    ? (LIVE_ACTIVE
      ? `One member missed, but this circle is protected. The organizer's cover topped up the pot, so you still get every dollar. The miss is on their card, and they owe the organizer now, not you.`
      : `One member missed, but this circle is protected. ${PRESET.inviter}'s cover topped up the pot, so you still get every dollar. The miss is on their card, and they owe her now, not you.`)
    : landed < c.pot
      ? `Most of the circle paid this ${c.period}. Their contributions came straight to your wallet.`
      : `The full pot from ${c.name}, ${c.period} ${c.you+1}. Sent straight to your wallet.`;
  const next = c.completed ? ` That was the last pot, the circle is complete.` : ` Next ${c.period} it goes to ${recipientName(c)}.`;
  const topupRow = c.lastTopUp > 0
    ? `<div class="kv" style="padding:7px 0"><span class="k">Protection covered a miss</span><span class="v">+$${c.lastTopUp}</span></div>` : '';
  const shortRow = (!c.lastTopUp && landed < c.pot)
    ? `<div class="kv" style="padding:7px 0"><span class="k">One member missed</span><span class="v">\u2212$${c.pot - landed}</span></div>` : '';
  main.innerHTML = `
  <section class="screen active v2 v2pot">
    <div class="celebrate">
      <span class="confetti" style="background:#E8A93D;top:14%;left:18%;transform:rotate(20deg)"></span>
      <span class="confetti" style="background:#31418F;top:20%;left:78%;transform:rotate(-15deg)"></span>
      <span class="confetti" style="background:#5B9E6F;top:11%;left:62%;transform:rotate(35deg)"></span>
      <span class="confetti" style="background:#C77FA6;top:26%;left:30%;transform:rotate(-25deg)"></span>
      <span class="confetti" style="background:#E8A93D;top:9%;left:44%;transform:rotate(10deg)"></span>
      <div class="bigcoin"><i class="fusdcoin mk-f" role="img" aria-label="fUSD"></i></div>
      <div class="kicker">IT'S YOUR TURN</div>
      <div class="hero">$${landed} is yours</div>
      <div class="cap">${cap}${next}</div>
      <div class="breakdown">
        <div class="kv" style="padding:7px 0"><span class="k">${c.size} members \u00d7 $${c.contribution}</span><span class="v">$${c.pot}</span></div>
        ${topupRow}${shortRow}
        <div class="kv" style="padding:7px 0"><span class="k">Fees</span><span class="v">$0</span></div>
        <div class="kv" style="padding:7px 0"><span class="k">To your wallet</span><span class="v blue">$${landed}</span></div>
      </div>
    </div>
    ${demoPanel()}
  </section>`;
  actionbar.innerHTML = `<div class="v2 vfoot">
    <button class="pay" id="act"><span class="lbl">Withdraw to my wallet</span><span class="amt">$${landed}</span></button>
    <button class="wabtn" id="wa">Thank the circle</button>
    <div class="subline">Keep paying so the circle finishes strong for everyone</div>
  </div>`;
  document.getElementById('act').onclick = ()=>{ if(chain.ackPot) chain.ackPot(); render(); };
  document.getElementById('wa').onclick = ()=>shareText(msgPot(c));
  wireDemo();
}

/* ---------- safety: your circle has your back ---------- */
function screenSafety(c){
  const s = chain.getSafety();
  const others = c.members.map((n,i)=>({n,i})).filter(m=>m.i!==c.you);
  /* Guardian floor: recovery needs a real strict majority quorum. One guardian
     is a sole recovery authority and two means both must approve, so require
     at least 3. This is app layer policy only, the contract at 038c44a does
     not enforce it (see zano-circle docs/THREAT-MODEL.md). Odd counts are a
     mild liveness optimization, not a security requirement, so even guardian
     counts are allowed. */
  const gOK = others.length >= 3;
  main.innerHTML = `
  <section class="screen active">
    <h2>If you lose your phone</h2>
    <p class="sub">Phones get lost. Your savings shouldn't.</p>
    ${s.guardians ? `
    <div class="status">
      <div class="big">Your circle has your back ✓</div>
      <div class="small">${s.guardians.length} members can approve your new phone. Most of them (${Math.floor(s.guardians.length/2)+1}) must agree, then a 3 day wait, so nobody can take your account while you still have it.</div>
    </div>` : gOK ? `
    <div class="card">
      ${others.map(m=>`
        <div class="row"><span class="k">${m.n}</span><span class="v">✓ trusted</span></div>
      `).join('')}
    </div>
    <p class="sub" style="margin-top:10px">Everyone in your circle can welcome your new phone back. Same savings, same card, nothing lost. Most of them (${Math.floor(others.length/2)+1} of ${others.length}) must agree before your new phone works, and there's a 3 day wait, so nobody can take your account while you still have your phone.</p>` : `
    <div class="card">
      <p class="sub">Phone recovery needs at least 3 guardians. Your circle is too small for guardian protection. Keep your backup words safe so you can always recover your account.</p>
    </div>`}
    <div class="card">
      <div class="row" id="backup-row" style="cursor:pointer">
        <span class="k">Backup words</span><span class="v">Show ›</span>
      </div>
      <p class="sub" style="margin-top:8px">A second way back in, just for you. Write them somewhere safe.</p>
    </div>
  </section>`;
  actionbar.innerHTML = s.guardians || !gOK
    ? `<button class="btn btn-quiet" id="back">Back to the circle</button>`
    : `<button class="btn btn-primary" id="act">Protect with my circle (${others.length} people)</button>
       <button class="btn btn-quiet" id="back">Not now</button>`;
  document.getElementById('back').onclick = render;
  const act = document.getElementById('act');
  if(act) act.onclick = async ()=>{
    if(!gOK) return; /* floor invariant lives next to the dangerous call */
    await chain.setGuardians(others.map(m=>m.i));
    screenProtected(c, others.length);
  };
  document.getElementById('backup-row').onclick = ()=>screenBackupWords(c);
}

function ordinal(n){
  const s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

/* ---------- invite links (?c=) ----------
   Live circle links carry the circle address in ?c= (written by
   circleLink above). Read it on load so an opener lands on that
   circle's join screen. The param travels over chat apps, so it is
   untrusted data: strict address validation, never rendered as
   HTML, and ignored entirely if it does not parse. */
function readInviteAddr(){
  let raw;
  try { raw = new URLSearchParams(location.search).get('c'); }
  catch(e){ return null; }
  if(!raw) return null;
  const E = window.ethers;
  if(E && E.isAddress){
    /* full EIP-55 check when ethers is already loaded */
    try { return E.isAddress(raw) ? E.getAddress(raw) : null; }
    catch(e){ return null; }
  }
  /* ethers is a deferred script and may not be up yet; fall back to
     a strict shape check and normalize to lowercase, which every
     ethers call accepts without a checksum complaint */
  return /^0x[0-9a-fA-F]{40}$/.test(raw) ? raw.toLowerCase() : null;
}

/* Set when the app was opened through a valid ?c= invite AND the live
   wiring actually connected to that circle. screenJoin uses it to show
   the circle address (a concrete identity to verify) and to drop the
   preset inviter language, which arrives in the same attacker-editable
   link (?v=) and would lend false authority to an unknown circle. */
let INVITE_ADDR = null;
function shortInvite(){ return INVITE_ADDR.slice(0,6) + '...' + INVITE_ADDR.slice(-4); }

/* True only after LiveChain actually connects. Preset fiction (inviter
   names, circle name) must never render over a real circle (F-4),
   whether the app arrived via invite link or was opened bare. */
let LIVE_ACTIVE = false;

/* ethers loads as a deferred script, which runs AFTER this inline
   script parses. On a cold load window.ethers is therefore absent
   here, and LiveChain would throw before the library ever arrives.
   Wait for it, but only on the live path: demo mode needs no ethers
   and must keep rendering instantly. Deferred scripts run before
   DOMContentLoaded, so that event is the signal; the timeout covers
   a dead CDN, in which case we resolve anyway and LiveChain fails
   into demo mode exactly as before. */
function ethersReady(timeoutMs){
  if(window.ethers) return Promise.resolve(true);
  return new Promise(resolve => {
    const done = () => resolve(Boolean(window.ethers));
    const t = setTimeout(done, timeoutMs);
    document.addEventListener('DOMContentLoaded', () => { clearTimeout(t); done(); }, { once: true });
    if(document.readyState !== 'loading'){ clearTimeout(t); done(); }
  });
}

(async () => {
  if (LIVE) {
    await ethersReady(10_000);
    const invite = readInviteAddr();
    if (invite) INVITE_ADDR = invite;
    if (invite && invite.toLowerCase() !== String(LIVE.circleAddr || '').toLowerCase()){
      /* invited into a different circle than the built-in one:
         point the live wiring at the invited circle and drop the
         configured name, which belongs to the other circle. This
         also keeps circleLink() re-sharing the right address. */
      LIVE.circleAddr = invite;
      LIVE.circleName = null;
    }
    try {
      chain = await LiveChain(LIVE);
      LIVE_ACTIVE = true;
      const ribbon = document.querySelector('.demo-ribbon');
      if (ribbon) ribbon.remove();
    } catch (e) {
      console.error('LiveChain failed, staying in demo mode:', e);
      /* the invite did not take effect; the demo screens must not
         carry its address as if it had */
      INVITE_ADDR = null;
    }
  }
  /* Preview convenience, demo mode only: opening the page with #home
     auto-joins so the URL lands straight on the Home screen instead of
     Join. No effect on live circles (LIVE path sets chain above). */
  if (!LIVE && location.hash === '#home') { try { await chain.join(); } catch(e){} }
  render();
})();
</script>
